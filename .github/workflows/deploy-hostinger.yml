name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list changes, upload nothing)"
        type: boolean
        default: true

permissions:
  contents: read

# One deployment at a time; never cancel an upload that is already running.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # If any check or the build fails, nothing is uploaded.
      - name: Validate
        run: npm run check:all

      - name: Build
        run: npm run build

      - name: Upload dist/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./domains/merciconcierge.com/public_html/
          # Pushes always deploy for real. Manual runs default to a dry run.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
